GOVERNANCE_CONTRACT:
  CURRENT_PHASE: 5-B

  PHASE_5B:
    MODE: Minimal_Decision_Activation
    INTENT:
      - PRESENTATION_LAYER_ONLY
      - NO_STRATEGY_DECISION
      - NO_ACCOUNTABILITY_ASSIGNMENT

    ALLOWED_T005_FIELDS:
      DISPLAY_OK:
        - UID
        - 供應商
        - 品牌
        - 商品型號
        - 商品名稱
        - 商品大類
        - 商品中類
        - 商品小類
        - 國際條碼
      DISPLAY_ONLY_NO_INTERPRET:
        - 商品狀態
        - 付款條件
      FORBIDDEN:
        - 商品歸屬公司
        - 可銷售公司

    ALLOWED_OUTPUT:
      - Mail supplementary text
      - Mail table columns (UID/brand/model)
      - UI Tooltip
      - Log output

    FORBIDDEN_OUTPUT:
      - Listing rate calculation
      - Listed/unlisted judgment
      - Eligibility result
      - Listing_History write
      - strategy_mapping decision

    DISCLAIMER: "※ 本郵件所列商品資訊僅供參考，不構成上架義務或責任歸屬判定。"

    NOTE:
      - Phase 5-B affects Presentation Layer ONLY.
      - No strategy decision, no accountability assignment.
      - If request involves Eligibility/Listing/Strategy, STOP immediately.

  PHASE_5A:
    MODE: Manual_Strategy_Registry
    INTENT:
      - READ_ONLY_JOIN
      - T005_REFERENCE_DISPLAY
      - HUMAN_REGISTRY_ONLY

    ALLOWED:
      - strategy_mapping read access
      - T005 lookup for display (VLOOKUP/XLOOKUP/QUERY)
      - REF columns for human reference

    FORBIDDEN:
      - T005 write-back
      - REF column inference (if/switch)
      - Mail/Listing/Eligibility integration
      - Automated strategy decisions

    JOIN_KEY:
      primary: strategy_mapping.product_id -> T005.UID
      fallback_display: [brand, product_model]

    REF_COLUMNS:
      - "[REF] 商品名稱"
      - "[REF] 商品大類"
      - "[REF] 商品中類"
      - "[REF] 商品小類"
      - "[REF] 商品歸屬公司"
      - "[REF] 可銷售公司"

    NOTE:
      - REF columns are for human reference only.
      - Do NOT use REF columns for logic, inference, or validation.
      - strategy_mapping remains a Manual Registry, not an automation source.

  PHASE_6:
    INTENT:
      - READ_ONLY_USAGE
      - FACT_PROJECTION
      - OBSERVATION_ONLY

    ALLOWED:
      - Listing_History aggregation
      - Platform-level listing rate
      - Read-only accessors
      - Mail rendering from FACT tables

    FORBIDDEN:
      - SKU_LEVEL_LISTING_STATUS
      - STRATEGY_MAPPING_USAGE
      - ELIGIBILITY_INFERENCE
      - CROSS_MODULE_STATUS_INFERENCE

    NOTE:
      - Items listed as FORBIDDEN are intentional non-implementations.
      - Do NOT treat them as missing features or technical debt.

  AI_INSTRUCTION:
    - If a task suggests implementing FORBIDDEN items,
      STOP and request Architect confirmation.
